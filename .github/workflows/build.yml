name: Windows and Linux builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: build (${{ matrix.container || matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            toolchain: stable
            container: debian:13
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - name: Debian 13 build environment
        if: runner.os == 'Linux'
        working-directory: /
        shell: bash
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl wget file zstd git build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libgpg-error0 libcom-err2 patchelf xvfb xauth x11-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - name: Debian Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/llamalauncher-rustup.sh
          sh /tmp/llamalauncher-rustup.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
      - name: Rust toolchain
        if: runner.os == 'Windows'
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: tauri-app -> target
          cache-on-failure: true
          key: ${{ matrix.container || matrix.os }}
      - run: npm ci
      - run: npm test
      - run: node tests/verify-glib-backport.mjs
      - run: node tests/generate-settings-guide.mjs --check
      - run: npm run typecheck
      - run: npm run build
      - name: Rust formatting
        run: cargo +${{ matrix.toolchain }} fmt --check
      - name: Rust lints
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked -- -D warnings
      - name: Native backend tests
        run: cargo +${{ matrix.toolchain }} test --release --locked
      - name: Browser runtime
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium --only-shell
      - name: Interface regression checks
        run: npm run test:gui
      - name: Interface measurements
        run: npm run benchmark:gui
      - name: Native release build
        run: cargo +${{ matrix.toolchain }} build --release --locked
      - name: Native Linux window smoke check
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: xvfb-run -a bash tests/linux-window-smoke.sh
      - name: Windows portable container compiler
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: choco install nsis --version=3.13.0 -y --no-progress
      - name: Package Windows release with fixed WebView2
        timeout-minutes: 20
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: ./release-windows.ps1
      - name: Package self-contained Linux AppImage
        timeout-minutes: 20
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        shell: bash
        run: |
          mkdir -p artifacts
          bash release-linux.sh --skip-clean-host 2>&1 | tee artifacts/linux-package.log
      - name: Downloadable single Windows EXE
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tauri-app/artifacts/release/LLamaLauncher-*-Windows-x86_64.exe
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-assets-${{ runner.os }}
          path: tauri-app/artifacts/release/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: LLamaLauncher-${{ runner.os }}
          path: |
            tauri-app/target/release/llama-server-configurator${{ runner.os == 'Windows' && '.exe' || '' }}
            tauri-app/artifacts/gui-*.png
            tauri-app/artifacts/gui-benchmark*.json
            tauri-app/artifacts/native-package-startup.json
            tauri-app/artifacts/LINUX_PACKAGE_VERSIONS.txt
            tauri-app/artifacts/linux-window-stderr.log
            tauri-app/artifacts/linux-package.log
            tauri-app/artifacts/appimage-clean-host.log
            tauri-app/artifacts/WINDOWS_PACKAGE_VERSIONS.json
            tauri-app/artifacts/THIRD_PARTY_NOTICES.txt
            README.md
            LICENSE
          if-no-files-found: error
  appimage-compatibility:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-Linux
          path: tauri-app/artifacts/release
      - name: Clean Debian 13 and Ubuntu 26.04 AppImage startup
        working-directory: tauri-app
        run: |
          (cd artifacts/release && sha256sum -c *.sha256)
          bash tests/appimage-clean-host.sh "$(realpath artifacts/release/*.AppImage)"
      - name: Downloadable single Linux AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: tauri-app/artifacts/release/*.AppImage
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: appimage-clean-host-evidence
          path: tauri-app/artifacts/appimage-clean-host.log
          if-no-files-found: error
  release:
    needs: [build, appimage-compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 1.1.2')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Publish verified 1.1.2 packages and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tauri-app/tests/publish-release.mjs

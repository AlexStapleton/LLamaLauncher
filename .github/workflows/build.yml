name: Windows and Linux builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            toolchain: stable
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf xvfb x11-utils
      - name: Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app -> target
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: node tests/verify-glib-backport.mjs
      - run: node tests/generate-settings-guide.mjs --check
      - run: npm run typecheck
      - run: npm run build
      - name: Rust formatting
        run: cargo +${{ matrix.toolchain }} fmt --check
      - name: Rust lints
        run: cargo +${{ matrix.toolchain }} clippy --all-targets --locked -- -D warnings
      - name: Native backend tests
        run: cargo +${{ matrix.toolchain }} test --release --locked
      - name: Browser runtime
        run: npx playwright install --with-deps chromium --only-shell
      - name: Interface regression checks
        run: npm run test:gui
      - name: Interface measurements
        run: npm run benchmark:gui
      - name: Native release build
        run: cargo +${{ matrix.toolchain }} build --release --locked
      - name: Native Linux window smoke check
        if: runner.os == 'Linux'
        run: xvfb-run -a bash tests/linux-window-smoke.sh
      - name: Windows installer compiler
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 1.1.1')
        shell: pwsh
        run: choco install nsis --version=3.11 -y --no-progress
      - name: Package Windows release with fixed WebView2
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 1.1.1')
        shell: pwsh
        run: ./release-windows.ps1
      - name: Package self-contained Linux AppImage
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 1.1.1')
        run: bash release-linux.sh
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 1.1.1')
        with:
          name: release-assets-${{ runner.os }}
          path: tauri-app/artifacts/release/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LLamaLauncher-${{ runner.os }}
          path: |
            tauri-app/target/release/llama-server-configurator${{ runner.os == 'Windows' && '.exe' || '' }}
            tauri-app/artifacts/gui-*.png
            tauri-app/artifacts/gui-benchmark*.json
            tauri-app/artifacts/native-package-startup.json
            tauri-app/artifacts/LINUX_PACKAGE_VERSIONS.txt
            tauri-app/artifacts/linux-window-stderr.log
            tauri-app/artifacts/appimage-clean-host.log
            tauri-app/artifacts/THIRD_PARTY_NOTICES.txt
            README.md
            LICENSE
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release 1.1.1')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish verified 1.1.1 installers and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tauri-app/tests/publish-release.mjs

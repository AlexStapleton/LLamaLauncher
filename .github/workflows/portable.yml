name: Windows setup EXE and Linux AppImage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf xvfb x11-utils
      - name: Windows toolchain and installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          choco install nsis --version=3.11 -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Windows build and setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable-x86_64-pc-windows-msvc test --release --locked
          cargo +stable-x86_64-pc-windows-msvc build --release --locked
          ./release-windows.ps1
      - name: Linux checks and AppImage
        if: runner.os == 'Linux'
        run: |
          bash package-appimage.sh
          bash tests/appimage-clean-host.sh "$(realpath artifacts/release/LLamaLauncher-1.1.2-Linux-x86_64.AppImage)"
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages-${{ runner.os }}
          path: tauri-app/artifacts/release/*
          compression-level: 0
          if-no-files-found: error

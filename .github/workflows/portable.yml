name: Portable Windows ZIP and Linux AppImage
on:
  workflow_dispatch:
    inputs:
      webview_url:
        description: Official Microsoft fixed x64 WebView2 CAB URL
        required: true
      webview_sha256:
        description: Expected fixed WebView2 CAB SHA256
        required: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri-app
        shell: pwsh
    env:
      WEBVIEW_URL: ${{ inputs.webview_url }}
      WEBVIEW_SHA256: ${{ inputs.webview_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - name: Obtain pinned official runtime inputs
        run: |
          $ErrorActionPreference='Stop'
          $url=[Uri]$env:WEBVIEW_URL
          if($url.Scheme -ne 'https' -or $url.Host -notlike '*.dl.delivery.mp.microsoft.com' -or $env:WEBVIEW_SHA256 -notmatch '^[0-9a-fA-F]{64}$'){throw 'Use the official fixed runtime URL and checksum'}
          New-Item -ItemType Directory -Path artifacts/inputs -Force | Out-Null
          Invoke-WebRequest -Uri $url -OutFile artifacts/inputs/webview.cab
          if((Get-FileHash artifacts/inputs/webview.cab -Algorithm SHA256).Hash -ne $env:WEBVIEW_SHA256){throw 'WebView2 checksum mismatch'}
          New-Item -ItemType Directory -Path artifacts/inputs/webview -Force | Out-Null
          & "$env:SystemRoot/System32/expand.exe" artifacts/inputs/webview.cab '-F:*' artifacts/inputs/webview | Out-Null
          if($LASTEXITCODE -ne 0){throw 'CAB extraction failed'}
          $webview=Get-ChildItem artifacts/inputs/webview -Filter msedgewebview2.exe -Recurse | Select-Object -First 1
          if((Get-AuthenticodeSignature $webview.FullName).Status -ne 'Valid'){throw 'WebView2 signature invalid'}
          "FIXED_WEBVIEW=$($webview.DirectoryName)" >> $env:GITHUB_ENV
      - run: npm run build
      - run: cargo +stable-x86_64-pc-windows-msvc fmt --check
      - run: cargo +stable-x86_64-pc-windows-msvc clippy --all-targets --locked -- -D warnings
      - run: cargo +stable-x86_64-pc-windows-msvc test --release --locked
      - run: ./package-portable.ps1 -FixedWebView2Directory $env:FIXED_WEBVIEW
      - uses: actions/upload-artifact@v7
        with:
          name: LLamaLauncher-Windows-portable
          path: |
            tauri-app/artifacts/LLamaLauncher-Windows-*.zip
            tauri-app/artifacts/LLamaLauncher-Windows-*.sha256
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: tauri-app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf xvfb jq
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo install cargo-tauri --version '^1.5' --locked
      - run: npm ci
      - run: bash package-appimage.sh
      - name: Native Linux window check
        run: xvfb-run -a bash tests/linux-window-smoke.sh
      - uses: actions/upload-artifact@v7
        with:
          name: LLamaLauncher-Linux-AppImage
          path: |
            tauri-app/artifacts/*.AppImage
            tauri-app/artifacts/*.AppImage.sha256
          if-no-files-found: error

name: Windows portable EXE and Linux AppImage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-24.04
            container: debian:13
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: tauri-app
    steps:
      - name: Debian 13 build environment
        if: runner.os == 'Linux'
        working-directory: /
        shell: bash
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl wget file zstd git build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libgpg-error0 libcom-err2 patchelf xvfb xauth x11-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Debian Rust toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/llamalauncher-rustup.sh
          sh /tmp/llamalauncher-rustup.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
      - name: Windows toolchain and portable container compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
          choco install nsis --version=3.13.0 -y --no-progress
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Windows build and portable EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +stable-x86_64-pc-windows-msvc test --release --locked
          cargo +stable-x86_64-pc-windows-msvc build --release --locked
          ./release-windows.ps1
      - name: Linux checks and AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --release --locked
          mkdir -p artifacts
          bash release-linux.sh --skip-clean-host 2>&1 | tee artifacts/linux-package.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages-${{ runner.os }}
          path: tauri-app/artifacts/release/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux'
        with:
          name: portable-linux-diagnostics
          path: |
            tauri-app/artifacts/linux-package.log
            tauri-app/artifacts/LINUX_PACKAGE_VERSIONS.txt
          if-no-files-found: warn
  appimage-compatibility:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages-Linux
          path: tauri-app/artifacts/release
      - name: Clean Debian 13 and Ubuntu 26.04 startup
        working-directory: tauri-app
        run: |
          (cd artifacts/release && sha256sum -c *.sha256)
          bash tests/appimage-clean-host.sh "$(realpath artifacts/release/*.AppImage)"

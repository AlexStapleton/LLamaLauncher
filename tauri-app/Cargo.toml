[package]
name = "llama-server-configurator"
version = "1.1.2"
edition = "2021"
authors = ["You"]
description = "Llama Server Configuration Manager with Tauri GUI"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "form", "query", "native-tls", "http2", "system-proxy"] }
sysinfo = "0.37"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync", "io-util", "fs", "net", "process", "macros"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
libc = "0.2"

[[bin]]
name = "llama-server-configurator"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true


[patch.crates-io]
glib = { path = "../vendor/glib-0.18.5" }
